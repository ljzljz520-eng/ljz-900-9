<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>门店整改 - 连锁药店巡检整改平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🔧 门店整改</h1><p id="storeName">店员扫码上传整改照片</p></header>
<div class="container">
  <div class="stat-grid">
    <div class="stat"><div class="num" id="cTotal">0</div><div class="lbl">问题总数</div></div>
    <div class="stat"><div class="num" id="cDone">0</div><div class="lbl">已整改</div></div>
    <div class="stat"><div class="num" id="cRate">0%</div><div class="lbl">完成率</div></div>
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbImg"></div>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function lb(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').style.display='flex';}
const code=new URLSearchParams(location.search).get('code');
if(!code){document.getElementById('list').innerHTML='<div class="card empty-tip">请扫描门店二维码进入</div>';}
async function load(){
  if(!code) return;
  const r=await fetch('/api/stores/'+code+'/issues');
  if(!r.ok){document.getElementById('list').innerHTML='<div class="card empty-tip">门店不存在</div>';return;}
  const {store,issues}=await r.json();
  document.getElementById('storeName').textContent='🏪 '+store.name+' · 上传整改照片';
  const done=issues.filter(i=>i.status==='done').length;
  document.getElementById('cTotal').textContent=issues.length;
  document.getElementById('cDone').textContent=done;
  document.getElementById('cRate').textContent=(issues.length?Math.round(done/issues.length*100):100)+'%';
  document.getElementById('list').innerHTML=issues.map(i=>`
    <div class="card">
      <div class="issue-head">
        <span class="issue-code">${i.code}</span>
        <span><span class="badge cat">${i.category}</span> <span class="badge ${i.status}">${i.status==='done'?'已整改':'待整改'}</span></span>
      </div>
      <div class="issue-meta">扣分 <span class="deduct">-${i.deductPoints}</span> ｜ ${i.createdAt.slice(0,16).replace('T',' ')}<br>${i.description||''}</div>
      <div class="pair">
        <figure><img src="/${i.problemImage}" onclick="lb(this.src)"><figcaption>问题照片</figcaption></figure>
        <figure>${i.rectifyImage?`<img src="/${i.rectifyImage}" onclick="lb(this.src)">`:'<div class="empty">待上传</div>'}<figcaption>整改照片</figcaption></figure>
      </div>
      <div class="file-picker" id="pk${i.id}" style="margin-top:10px" onclick="document.getElementById('f${i.id}').click()">📷 ${i.rectifyImage?'重新上传整改照片':'点击拍摄 / 上传整改照片'}</div>
      <input type="file" id="f${i.id}" accept="image/*" capture="environment" style="display:none" onchange="upload(${i.id},this)">
    </div>`).join('')||'<div class="card empty-tip">🎉 本店暂无待整改问题</div>';
}
async function upload(id,input){
  if(!input.files[0]) return;
  const fd=new FormData(); fd.append('image',input.files[0]);
  const r=await fetch('/api/issues/'+id+'/rectify',{method:'POST',body:fd});
  const d=await r.json();
  if(!r.ok) return toast(d.error);
  toast('✅ 整改照片已上传'); load();
}
load();
</script>
</body>
</html>
